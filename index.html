<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5A57">
<title>BOULPAT MASTER</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --four:#0E5A57;
  --four-ink:#093D3B;
  --farine:#F2F4F1;
  --pate:#FFFFFF;
  --croute:#E0A526;
  --encre:#1D2A2E;
  --encre-2:#5B6B70;
  --trait:#D6DCD8;
  --ok:#2E7D4F; --warn:#B7791F; --off:#9A3B3B;
  --r:14px;
  --font:"Segoe UI",system-ui,-apple-system,"Noto Sans Arabic","Noto Sans",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--farine);color:var(--encre);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-top:env(safe-area-inset-top);-webkit-tap-highlight-color:transparent}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--croute);outline-offset:2px}

/* Structure */
.app{display:grid;grid-template-rows:auto 1fr;min-height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--four);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;margin-inline-end:auto}
.brand img{width:36px;height:36px;border-radius:50%;background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.35);background:transparent;
  color:#fff;border-radius:999px;padding:6px 12px;min-height:40px;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.12)}
.chip select{background:transparent;border:0;color:#fff;cursor:pointer}
.chip select option{color:var(--encre)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.dot.off{background:var(--croute)}
#authBtn{font-weight:600}
#authBtn.connected{background:rgba(255,255,255,.18)}

.shell{display:grid;grid-template-columns:220px 1fr;min-height:0}
.nav{background:var(--pate);border-inline-end:1px solid var(--trait);padding:12px;display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:start;
  padding:12px 14px;border-radius:10px;cursor:pointer;min-height:48px;color:var(--encre-2);font-weight:600}
.nav button svg{width:22px;height:22px;flex:none}
.nav button:hover{background:var(--farine)}
.nav button[aria-current="page"]{background:var(--four);color:#fff}
main{padding:24px;max-width:1100px;width:100%;margin-inline:auto}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--encre-2);margin:0 0 24px}
h2{font-size:1.1rem;margin:28px 0 12px}

/* Familles */
.fam{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--pate);border:1px solid var(--trait);border-radius:var(--r);padding:18px}
.fam .card{border-inline-start:6px solid var(--four);display:flex;flex-direction:column;gap:6px}
.fam .card[data-k="negoce"]{border-inline-start-color:var(--croute)}
.fam .card h3{margin:0;font-size:1.05rem}
.fam .card .n{font-size:2rem;font-weight:700;line-height:1}
.fam .card small{color:var(--encre-2)}
.tag{display:inline-block;background:var(--farine);border-radius:6px;padding:2px 8px;font-size:.82rem;color:var(--encre-2);margin-inline-end:6px}

/* Feuille de route */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--pate);border:1px solid var(--trait);border-radius:12px;padding:12px 14px}
.steps .b{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;font-weight:700;
  background:var(--farine);color:var(--encre-2);border:1px solid var(--trait)}
.steps li.done .b{background:var(--ok);color:#fff;border-color:var(--ok)}
.steps li.now{border-color:var(--four);box-shadow:inset 0 0 0 1px var(--four)}
.steps li.now .b{background:var(--four);color:#fff;border-color:var(--four)}
.steps strong{display:block}
.steps span{color:var(--encre-2);font-size:.93rem}

/* États vides / réglages */
.empty{text-align:center;padding:48px 20px;border:2px dashed var(--trait);border-radius:var(--r);background:var(--pate)}
.empty p{color:var(--encre-2);margin:6px auto 18px;max-width:46ch}
.btn{border:0;background:var(--four);color:#fff;border-radius:10px;padding:12px 20px;min-height:48px;font-weight:700;cursor:pointer}
.btn[disabled]{background:var(--trait);color:var(--encre-2);cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:600}
.field select{padding:12px;border:1px solid var(--trait);border-radius:10px;background:var(--pate);min-height:48px;max-width:360px}
table{border-collapse:collapse;width:100%;background:var(--pate);border-radius:var(--r);overflow:hidden;border:1px solid var(--trait)}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--trait)}
th{background:var(--farine);font-size:.92rem}
.yes{color:var(--ok);font-weight:700}.no{color:var(--off)}
.scroll{overflow-x:auto}

/* Mobile : navigation en bas */
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .nav{position:fixed;inset-inline:0;bottom:0;z-index:10;flex-direction:row;justify-content:space-around;
    border-inline-end:0;border-top:1px solid var(--trait);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .nav button{flex-direction:column;gap:2px;font-size:.74rem;padding:6px 4px;min-height:56px;flex:1;justify-content:center;align-items:center;text-align:center}
  main{padding:16px 16px 96px}
  .chip .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.muted{color:var(--encre-2)}
.btn.ghost{background:transparent;color:var(--four);border:1px solid var(--four)}
.btn.danger{background:var(--off)}
.filebtn{display:inline-flex;align-items:center;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.toolbar input,.toolbar select,.fl input,.fl select,.fl textarea,.ing input,.ing select,.stp input,.stp select{
  font:inherit;padding:10px 12px;border:1px solid var(--trait);border-radius:10px;background:var(--pate);min-height:46px;width:100%;color:inherit}
.toolbar input{flex:1 1 240px;width:auto}.toolbar select{width:auto;flex:0 1 200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.fcard{display:flex;align-items:center;gap:12px;text-align:start;background:var(--pate);border:1px solid var(--trait);border-radius:var(--r);padding:10px;cursor:pointer;width:100%}
.fcard:hover{border-color:var(--four)}
.fcard .ph{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--farine);display:grid;place-items:center}
.fcard .ph img{width:100%;height:100%;object-fit:cover}.noph svg{width:28px;height:28px;color:var(--encre-2)}
.fcard .ft{flex:1;display:grid;gap:2px;min-width:0}.fcard small{color:var(--encre-2)}
.badge{flex:none;font-size:.78rem;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--farine);color:var(--encre-2)}
.badge.s-validee{background:#DCEFE3;color:var(--ok)}.badge.s-test{background:#F8EBC8;color:var(--warn)}.badge.s-archivee{background:#E7E7E7;color:#666}
.famc{text-align:start;cursor:pointer;font:inherit;color:inherit}
.famc:hover{border-color:var(--four)}
.famc .n{font-size:2rem;font-weight:700;line-height:1}
.fam button.card{border-inline-start:6px solid var(--four);display:flex;flex-direction:column;gap:6px}
.fam button.card[data-k="negoce"]{border-inline-start-color:var(--croute)}
.card{margin-bottom:14px}.card h2{margin:0 0 10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:8px}
.fl{display:grid;gap:5px;align-content:start}.fl>span{font-weight:600;font-size:.93rem}.fl.wide{grid-column:1/-1}
.ing{display:grid;grid-template-columns:1fr 90px 84px 110px 44px;gap:8px;margin-bottom:12px;align-items:center}
.ing .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:0}
.stp{display:grid;grid-template-columns:150px 1fr 90px 90px auto;gap:8px;margin-bottom:10px;align-items:center}
.mv{display:flex;gap:4px}
.mv button,.x{min-width:44px;min-height:44px;border:1px solid var(--trait);background:var(--pate);border-radius:10px;cursor:pointer;font-size:1.1rem}
.mv button[disabled]{opacity:.35;cursor:default}
.x{color:var(--off)}
.al{display:inline-block;background:#F8EBC8;color:#7A5A12;border-radius:6px;padding:1px 8px;font-size:.8rem;margin-inline-end:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{border:1px solid var(--trait);background:var(--pate);border-radius:999px;padding:8px 14px;min-height:42px;cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--croute);border-color:var(--croute);font-weight:700}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.kv div{background:var(--farine);border-radius:10px;padding:10px 12px}
.kv dt{font-size:.85rem;color:var(--encre-2)}.kv dd{margin:2px 0 0;font-weight:700}
.head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.head h1{margin:0}
.cmd-ligne{display:grid;grid-template-columns:1fr 100px 130px 44px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--trait)}
.cmd-ligne:last-child{border-bottom:0}
.cmd-nom{font-weight:600}
.cmd-q,.cmd-u{padding:10px;border:1px solid var(--trait);border-radius:10px;font:inherit;background:var(--pate);min-height:44px}
@media (max-width:600px){
  .cmd-ligne{grid-template-columns:1fr 90px 44px;grid-template-areas:"n q x" "u u u"}
  .cmd-nom{grid-area:n}.cmd-q{grid-area:q}.cmd-u{grid-area:u}.cmd-ligne .x{grid-area:x}
}
.big{width:140px;height:140px;object-fit:cover;border-radius:12px}.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px}
.proc{padding-inline-start:22px;margin:0 0 8px}.proc li{margin-bottom:8px}
#toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:420px;margin-inline:auto;background:var(--encre);color:#fff;
  padding:12px 16px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}

/* ==================== MODE TERRAIN ==================== */
.terrain-list{display:grid;gap:16px}
.terrain-card{display:flex;gap:16px;align-items:center;background:var(--pate);border:2px solid var(--trait);border-radius:18px;padding:20px;cursor:pointer;text-align:start;width:100%;font:inherit;color:inherit}
.terrain-card:hover{border-color:var(--four);background:#FAFBFA}
.terrain-card .big-icon{width:72px;height:72px;border-radius:16px;background:var(--four);color:#fff;display:grid;place-items:center;font-size:2rem;flex:none;font-weight:700}
.terrain-card.done .big-icon{background:var(--ok)}
.terrain-card h3{margin:0 0 4px;font-size:1.2rem}
.terrain-card .meta{color:var(--encre-2);font-size:.98rem}
.terrain-card .prog{margin-inline-start:auto;flex:none;font-size:.95rem;font-weight:600;color:var(--encre-2);text-align:end}

.terrain-run{display:grid;gap:16px;max-width:900px;margin-inline:auto}
.terrain-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--pate);border:2px solid var(--trait);border-radius:16px;padding:16px 20px}
.terrain-top h2{margin:0;font-size:1.3rem;flex:1 1 auto}
.terrain-top .actions{display:flex;gap:8px;flex-wrap:wrap}

.step-run{background:var(--pate);border:3px solid var(--trait);border-radius:18px;padding:20px;display:grid;gap:14px;transition:border-color .2s,box-shadow .2s}
.step-run.done{border-color:var(--ok);background:#F1F8F3}
.step-run.running{border-color:var(--croute);box-shadow:0 0 0 4px rgba(224,165,38,.22)}
.step-run.expired{border-color:var(--off);box-shadow:0 0 0 4px rgba(154,59,59,.22)}
.step-run .hdr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.step-run .hdr .typ{font-size:1.25rem;font-weight:700;flex:1 1 auto}
.step-run .hdr .check{width:56px;height:56px;border-radius:14px;border:3px solid var(--trait);background:var(--pate);cursor:pointer;font-size:1.6rem;flex:none;line-height:1}
.step-run.done .hdr .check{background:var(--ok);color:#fff;border-color:var(--ok)}
.step-run .desc{color:var(--encre-2);font-size:1.02rem}
.step-run .target{color:var(--encre-2);font-size:.92rem}
.step-run .timer{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.timer-display{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:160px;text-align:center;background:var(--farine);border-radius:14px;padding:12px 20px;letter-spacing:.03em}
.timer-display.running{background:#FCEFC7;color:#7A5A12}
.timer-display.done{background:#DCEFE3;color:var(--ok)}
.timer-display.expired{background:#F8D9D9;color:var(--off)}
.timer-btn{min-height:60px;min-width:60px;padding:14px 24px;font-weight:700;border-radius:14px;border:0;cursor:pointer;background:var(--four);color:#fff;font-size:1.05rem}
.timer-btn.ghost{background:transparent;color:var(--four);border:2px solid var(--four)}
.timer-btn.danger{background:var(--off);color:#fff}
.timer-btn:disabled{opacity:.4;cursor:not-allowed}

.terrain-progress{display:flex;gap:8px;align-items:center}
.terrain-progress .bar{flex:1;height:10px;border-radius:6px;background:var(--trait);overflow:hidden}
.terrain-progress .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.terrain-progress small{color:var(--encre-2);font-weight:600}

@media (max-width:600px){
  .terrain-card{flex-direction:column;align-items:flex-start;gap:10px}
  .terrain-card .prog{margin-inline-start:0}
  .timer-display{font-size:2rem;min-width:130px}
}
@media print{ .terrain-noprint{display:none!important} }

/* ---- Connexion ---- */
#auth{position:fixed;inset:0;z-index:100;background:var(--farine);display:grid;place-items:center;padding:20px;overflow:auto}
#auth[hidden]{display:none}
.auth-card{position:relative;width:100%;max-width:400px;background:var(--pate);border:1px solid var(--trait);border-radius:18px;padding:28px 24px;display:grid;gap:12px;text-align:center}
.auth-card h1{font-size:1.4rem;margin:0}.auth-card h2{margin:6px 0 4px;font-size:1.1rem}
.auth-logo{width:84px;height:84px;margin-inline:auto;border-radius:50%}
.auth-lang{position:absolute;top:12px;inset-inline-end:12px;color:var(--four);border-color:var(--trait);min-height:36px;padding:4px 12px}
.auth-card form{display:grid;gap:12px;text-align:start}
.auth-card .fl input{font:inherit;padding:12px;border:1px solid var(--trait);border-radius:10px;min-height:48px;width:100%}
.autherr{color:var(--off);font-weight:600;min-height:1.4em;margin:0}
.linkb{background:none;border:0;color:var(--four);text-decoration:underline;cursor:pointer;padding:8px;min-height:44px}
.uid{display:block;padding:10px;background:var(--farine);border-radius:10px;font-size:.85rem;word-break:break-all;user-select:all}
.btn[disabled]{opacity:.6}
/* ---- Impression ---- */
@media print{
  .top,.nav,.noprint,#toast,#auth{display:none!important}
  body{background:#fff}.shell{display:block}main{padding:0;max-width:none}
  .card{break-inside:avoid;border-color:#bbb}
}
.ofl{margin-bottom:12px}
.ofh{display:flex;gap:14px;align-items:center}
.oft{font-weight:800;font-size:1.3rem;background:var(--four);color:#fff;border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums;flex:none}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--four)}
.warn{background:#FBEFD3;border:1px solid var(--croute);border-radius:12px;padding:10px 14px;margin-bottom:12px}.warn ul{margin:6px 0 0;padding-inline-start:20px}
.cmd-lignes{margin-bottom:12px}
body.tfs .top,body.tfs .nav{display:none}
body.tfs main{padding-bottom:24px}
.tstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#FCEFC7;border:1px solid var(--croute);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.tchip{display:inline-flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:6px 12px}
.tchip b{font-variant-numeric:tabular-nums;font-size:1.1rem}.tchip.expired{background:#F8D9D9;color:var(--off)}
#alarm{position:fixed;inset:0;z-index:200;background:rgba(154,59,59,.96);display:grid;place-items:center;padding:20px;animation:alm 1s steps(2) infinite}
#alarm[hidden]{display:none}
.alarm-card{background:#fff;border-radius:22px;padding:28px 24px;max-width:420px;width:100%;text-align:center;display:grid;gap:10px}
.alarm-ic{font-size:3.5rem}.alarm-card h2{margin:0;font-size:1.6rem}.alarm-card p{margin:0;font-size:1.15rem}
@keyframes alm{50%{background:rgba(120,30,30,.96)}}
@media print{#alarm{display:none!important}}

.btn.small{min-height:40px;padding:6px 14px;font-size:.9rem}
.stmedia{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mthumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--trait);display:inline-grid;place-items:center;background:var(--farine);font-size:.8rem}
.smedia{display:block;max-width:100%;width:min(100%,420px);max-height:300px;object-fit:contain;border-radius:12px;margin-top:8px;background:#000}
img.smedia{cursor:zoom-in;background:var(--farine)}
.srcs{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.srcs li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.srcs a{color:var(--four);font-weight:600;word-break:break-all}
#lb,#modal{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:16px}
#lb{background:rgba(0,0,0,.88);cursor:zoom-out}#lb img{max-width:100%;max-height:100%;border-radius:8px}
#modal{background:rgba(29,42,46,.7)}
#lb[hidden],#modal[hidden]{display:none}
.qr-card{background:#fff;border-radius:20px;padding:24px;max-width:380px;width:100%;display:grid;gap:10px;text-align:center;justify-items:center}
.qr-card h2{margin:0}.qrbig{width:min(260px,70vw)}.qrbig svg,.qrbox svg{width:100%;height:auto;display:block}
.print-head{display:none}
@page{size:A4;margin:14mm}
@media print{
  .print-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #0E5A57;padding-bottom:10px;margin-bottom:14px}
  .print-head img{width:56px;height:56px;border-radius:50%}
  .qrbox{margin-inline-start:auto;width:90px}
  video.smedia{display:none}img.smedia{max-height:50mm;width:auto}
  body{font-size:11pt}.card{box-shadow:none;margin-bottom:8px}
  .chipb,.btn,.filebtn{display:none!important}
  body:not(.pqr) #modal,#lb{display:none!important}
  body.pqr .app,body.pqr #toast{display:none!important}
  body.pqr #modal{position:static;background:#fff;display:grid}
  body.pqr .qr-card .row{display:none}
}

.qtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.badge.s-bad{background:#F8D9D9;color:var(--off)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:8px}
.qi{display:grid;gap:2px;background:var(--pate);border:1px solid var(--trait);border-inline-start:6px solid var(--croute);border-radius:12px;padding:10px 14px}
.qi.ok{border-inline-start-color:var(--ok)}.qi.bad{border-inline-start-color:var(--off);background:#FDF1F1}.qi span{color:var(--encre-2);font-size:.9rem}
.qsum{text-align:start;cursor:pointer;font:inherit;color:inherit;width:100%;margin-bottom:14px;border-inline-start:6px solid var(--four)}
.qsum.bad{border-inline-start-color:var(--off)}.qsum h3{margin:0}
.qok,.qbad{padding:10px 14px;border-radius:10px;margin-bottom:8px}
.qok{background:#DCEFE3;color:var(--ok)}.qbad{background:#F8D9D9;color:var(--off)}
tr.bad td{background:#FBE3E3}
.cl{display:grid;gap:8px}
.clrow{display:flex;gap:12px;align-items:center;background:var(--pate);border:1px solid var(--trait);border-radius:12px;padding:10px 14px}
.clrow.done{background:#EEF7F1;border-color:#BFDCC9}
.lblprev{overflow:auto;padding:8px;background:var(--farine);border-radius:12px}

/*PURE-START*/
const UNITS = ['g','kg','ml','L'];
const TO_G  = { g:1, kg:1000, ml:1, L:1000 };
const STEP_TYPES = ['petrissage','pointage','faconnage','appret','cuisson','finitions','autre'];
const PREFIX = { boul_fab:'BF', boul_neg:'BN', viennois:'VI', pat_fine:'PF', pat_maroc:'PM' };

const ALLERGENS = [
 {id:'gluten',   kw:['farine','ble','seigle','orge','avoine','semoule','epeautre','froment','gluten','chapelure','دقيق','قمح','شعير','سميد','نخالة']},
 {id:'oeufs',    kw:['oeuf','œuf','jaune d','blanc d','ovo','بيض']},
 {id:'lait',     kw:['lait','beurre','creme','fromage','yaourt','yogourt','lactose','mascarpone','ricotta','caseine','حليب','زبدة','كريمة','جبن','لبن']},
 {id:'coque',    kw:['amande','noisette','noix','pistache','cajou','pecan','macadamia','praline','pralin','لوز','بندق','جوز','فستق','كاجو']},
 {id:'arachide', kw:['arachide','cacahuete','فول سوداني','كاوكاو']},
 {id:'sesame',   kw:['sesame','tahini','سمسم','جلجلان']},
 {id:'soja',     kw:['soja','صوجا','صويا']},
 {id:'poisson',  kw:['poisson','thon','saumon','سمك','تونة']},
 {id:'crustaces',kw:['crevette','crabe','homard','langoustine','قمرون','جمبري']},
 {id:'mollusques',kw:['moule','calmar','huitre','escargot','بلح البحر']},
 {id:'celeri',   kw:['celeri','كرفس']},
 {id:'moutarde', kw:['moutarde','خردل']},
 {id:'lupin',    kw:['lupin','ترمس']},
 {id:'sulfites', kw:['sulfite','metabisulfite','raisin sec','abricot sec','vin blanc','vin rouge','كبريتات']}
];

const norm = s => String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const num  = v => { const n = parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(n) ? n : 0; };
const esc  = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid  = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function detect(text){
  let t = norm(text);
  t = t.replace(/noix de muscade|noix de coco|beurre de cacao|lait de coco/g,' ')
       .replace(/lait d['’]amande/g,' amande ');
  const out = new Set();
  ALLERGENS.forEach(a => a.kw.forEach(k => {
    const nk = norm(k);
    if(/[\u0600-\u06FF]/.test(nk)){ if(t.includes(nk)) out.add(a.id); }
    else if(new RegExp('(^|[^a-z])' + nk.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).test(t)) out.add(a.id);
  }));
  return out;
}
const isNegoce = f => f.famille === 'boul_neg';
function autoAllerg(f){
  if(isNegoce(f)) return detect((f.nomFr||'') + ' ' + (f.nomAr||'') + ' ' + (f.composition||''));
  return detect((f.ingredients||[]).map(i => i.nom).join(' , '));
}
function finalAllerg(f){
  const s = autoAllerg(f), a = f.allerg || {add:[],rem:[]};
  (a.add||[]).forEach(x => s.add(x));
  (a.rem||[]).forEach(x => s.delete(x));
  return s;
}
const lineCost = i => num(i.qte) * (TO_G[i.unite]||1) / 1000 * num(i.prix);

function calc(f){
  const r = { pate:0, cout:0, nb:0, perte:null, coutPiece:null, coutKg:null, pvSug:null, margeR:null };
  const m = Math.min(Math.max(num(f.margeCible),0),99);
  const pv = num(f.prixVente);
  if(isNegoce(f)){
    r.coutPiece = num(f.prixAchat) > 0 ? num(f.prixAchat) : null;
  } else {
    (f.ingredients||[]).forEach(i => { r.pate += num(i.qte)*(TO_G[i.unite]||1); r.cout += lineCost(i); });
    const crue = num(f.pieceCrue), cuit = num(f.poidsCuit);
    r.nb = crue > 0 ? Math.floor(r.pate / crue) : 0;
    if(crue > 0 && cuit > 0) r.perte = (crue - cuit) / crue * 100;
    r.coutPiece = r.nb > 0 ? r.cout / r.nb : null;
    r.coutKg = r.pate > 0 ? r.cout / (r.pate/1000) : null;
  }
  if(r.coutPiece != null) r.pvSug = r.coutPiece / (1 - m/100);
  if(r.coutPiece != null && pv > 0) r.margeR = (pv - r.coutPiece) / pv * 100;
  return r;
}
function nextCode(fiches, fam){
  const p = PREFIX[fam] || 'XX'; let max = 0;
  fiches.forEach(f => { const m = String(f.code||'').match(new RegExp('^'+p+'-(\\d+)$')); if(m) max = Math.max(max, +m[1]); });
  return p + '-' + String(max+1).padStart(3,'0');
}
/*PURE-END*/

let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600);
}

function mediaCtl(e, k){
  const m = e.media;
  const prev = m ? (m.type==='video' ? `<span class="mthumb vid">▶ ${t('video')}</span>` : `<img class="mthumb" src="${m.src}" alt="">`) : '';
  return `<div class="stmedia">${prev}
    <label class="btn ghost small filebtn">${m ? t('media_change') : t('media_add')}<input type="file" data-media="${k}" accept="image/*,video/*" hidden></label>
    ${m ? `<button class="btn ghost small" data-act="media-del" data-idx="${k}" type="button">${t('media_del')}</button>` : ''}
    <span class="muted" id="mprog-${k}"></span></div>`;
}
const mediaHTML = m => !m ? '' : m.type==='video'
  ? `<video class="smedia" src="${esc(m.url)}" controls preload="none" playsinline></video>`
  : `<img class="smedia" src="${m.src}" alt="" data-lb="1">`;
const stepMedia = (l, i) => { const f = S.fiches.find(x => x.id===l.ficheId), fe = f && f.etapes && f.etapes[i]; return fe && l.etapes[i] && fe.type===l.etapes[i].type ? fe.media : null; };
const fmtSize = n => !n ? '' : n > 1048576 ? (n/1048576).toFixed(1).replace('.',',') + ' Mo' : Math.max(1, Math.round(n/1024)) + ' Ko';
const safeName = s => String(s||'fichier').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'_').slice(-60);
function compressImage(file, max, q){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const r = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width*r); cv.height = Math.round(img.height*r);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
function storageErr(e){
  const c = (e && e.code) || '';
  if(c==='storage/unauthorized') return t('st_unauth');
  if(/bucket-not-found|project-not-found|unknown/.test(c)) return t('st_off');
  return t('err_cloud');
}
async function handleStepMedia(k, file){
  const d = S.draft; if(!file || !d) return; const e = d.etapes[k]; if(!e) return;
  if(file.type.startsWith('image/')){
    try{ e.media = {type:'image', src: await compressImage(file, 640, .7)}; S.dirty = true; render(); }catch(err){ toast(t('err_cloud')); }
    return;
  }
  if(!file.type.startsWith('video/')) return;
  if(file.size > 25*1048576){ toast(t('err_big')); return; }
  if(!window.BPM_CLOUD || !navigator.onLine){ toast(t('err_need_cloud')); return; }
  const prog = $('#mprog-' + k);
  try{
    const r = await window.BPM_CLOUD.upload('fiches/' + d.id + '/etapes/' + Date.now() + '-' + safeName(file.name), file, p => { const el = $('#mprog-' + k); if(el) el.textContent = Math.round(p*100) + ' %'; });
    if(e.media && e.media.path) (d._rm = d._rm || []).push(e.media.path);
    e.media = {type:'video', url:r.url, path:r.path}; S.dirty = true; render();
  }catch(err){ toast(storageErr(err)); if(prog) prog.textContent = ''; }
}
async function handleSource(file){
  const d = S.draft; if(!file || !d) return;
  if(file.size > 25*1048576){ toast(t('err_big')); return; }
  if(!window.BPM_CLOUD || !navigator.onLine){ toast(t('err_need_cloud')); return; }
  try{
    const r = await window.BPM_CLOUD.upload('fiches/' + d.id + '/source/' + Date.now() + '-' + safeName(file.name), file, p => { const el = $('#srcprog'); if(el) el.textContent = Math.round(p*100) + ' %'; });
    (d.sources = d.sources || []).push({nom:file.name, url:r.url, path:r.path, type:file.type, taille:file.size, date:new Date().toISOString()});
    S.dirty = true; render();
  }catch(err){ toast(storageErr(err)); const el = $('#srcprog'); if(el) el.textContent = ''; }
}

/* QR code, lien de partage, impression PDF */
let _qr = null;
async function qrSVG(text){
  _qr = _qr || await import('./qr.js');
  const q = _qr.default(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({cellSize:4, margin:0, scalable:true});
}
const ficheLink = id => location.origin + location.pathname + '#fiche=' + encodeURIComponent(id);
const printHead = (title, withQR) => `<div class="print-head"><img src="logo.png" alt=""><div><strong>BOULPAT MASTER · La Pâtisserie</strong><br><span>${esc(title)}</span></div>${withQR ? '<div class="qrbox" id="qrprint"></div>' : ''}</div>`;
async function printFiche(id){
  try{ const el = $('#qrprint'); if(el) el.innerHTML = await qrSVG(ficheLink(id)); }catch(e){}
  toast(t('pdf_hint')); setTimeout(() => window.print(), 250);
}
async function showQR(id){
  const f = S.fiches.find(x => x.id===id); if(!f) return;
  const link = ficheLink(id); let svg = '';
  try{ svg = await qrSVG(link); }catch(e){ toast(t('err_engine')); return; }
  const m = $('#modal'); m.hidden = false; m.dataset.link = link; m.dataset.name = fname(f);
  m.innerHTML = `<div class="qr-card" role="dialog" aria-modal="true"><h2>${t('qr_title')}</h2><div class="qrbig">${svg}</div>
    <strong>${esc(fname(f))}</strong><span class="muted">${esc(f.code)}</span><code class="uid">${esc(link)}</code>
    <div class="row" style="justify-content:center"><button class="btn ghost" data-m="copy" type="button">${t('qr_copy')}</button>
    ${navigator.share ? `<button class="btn ghost" data-m="share" type="button">${t('qr_share')}</button>` : ''}

function authErr(e){
  const c = (e && e.code) || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return t('auth_bad');
  if(c.includes('email-already')) return t('auth_exists');
  if(c.includes('weak-password')) return t('auth_weak');
  if(c.includes('invalid-email')) return t('auth_email');
  if(c.includes('network')) return t('auth_net');
  if(c.includes('too-many')) return t('auth_many');
  if(c.includes('popup') || c.includes('cancelled')) return t('auth_popup');
  if(c.includes('unauthorized-domain')) return t('auth_domain');
  return c || (e && e.message) || 'Erreur';
}

    if(state==='login'){ A.user = null; A.locked = false; A.err = ''; }
    else if(user !== undefined) A.user = user;
    A.locked = (state==='ready' || state==='local');
    if(state==='ready') store.set('cloudOK', 1);
    if(was !== state) render(); else updateAuthUI();
  },
  setRole(r){ if(ROLES[r]){ store.set('profileRole', r); if(S.role !== r){ S.role = r; if(S.auth.state==='ready') render(); } } },
  setData(kind, arr){

    S[kind] = arr.concat(pend); persistKey(kind); refreshQ();
  },
  setEtiq(obj){
    if(S.etiq._pending){ if(can('write')){ const c = clone(S.etiq); delete c._pending; cloudQ('saveItem', 'config', Object.assign({id:'etiquette'}, c)); } return; }
    if(obj){ S.etiq = {raison:obj.raison||'', adresse:obj.adresse||'', tel:obj.tel||''}; persistKey('etiq'); refreshQ(); }
  },
  setOFs(arr){
    const pend = S.ofs.filter(o => o._pending && !arr.some(x => x.id===o.id));

/* ---- Fabrication : commandes → Ordre de Fabrication ---- */
const loadEngine = async () => window.OF_ENGINE || (window.OF_ENGINE = await import('./of-engine.js'));
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dayFmt = iso => { const p = String(iso||todayISO()).split('-').map(Number);
  return new Date(p[0], p[1]-1, p[2]).toLocaleDateString(S.lang==='ar' ? 'ar-MA-u-nu-latn' : 'fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); };
const toMin = v => { const m = /^(\d{1,2}):(\d{2})$/.exec(v||''); return m ? (+m[1])*60 + (+m[2]) : 6*60; };
const hhmm = mn => { const x = Math.round(mn); return String(Math.floor(x/60)%24).padStart(2,'0') + ':' + String(x%60).padStart(2,'0'); };
const fq = (g, liq) => g >= 1000 ? fmt(g/1000,0,1) + ' ' + (liq?'L':'kg') : fmt(g,0,0) + ' ' + (liq?'ml':'g');
const producible = () => S.fiches.filter(f => !isNegoce(f) && f.statut!=='archivee' && (f.ingredients||[]).some(i => num(i.qte) > 0))
  .sort((a,b) => fname(a).localeCompare(fname(b), S.lang));
const persistOFs = () => { try{ localStorage.setItem('bpm.ofs', JSON.stringify(S.ofs)); }catch(e){} };
const cloudSaveOF = o => { if(window.BPM_CLOUD) window.BPM_CLOUD.saveOF(clone(o)); };
const cloudDelOF  = id => { if(window.BPM_CLOUD) window.BPM_CLOUD.delOF(id); };
const lname = l => S.lang==='ar' ? (l.nomAr || l.nomFr) : l.nomFr;

function computeOF(){
  const E = window.OF_ENGINE, c = S.cmd; if(!E || !c) return null;
  const cmds = c.lignes.map(l => ({ficheId:l.ficheId, quantite:num(l.quantite), unite:l.unite}));
  const of = E.genererOF(cmds, S.fiches, {debutMin: toMin(c.debut), jour: c.jour});
  const al = new Set();
  of.lignes.forEach(l => { const f = S.fiches.find(x => x.id===l.ficheId); if(f) finalAllerg(f).forEach(a => al.add(a)); });
  of.allergenes = [...al];
  of.commandes = c.lignes.map(l => ({ficheId:l.ficheId, quantite:l.quantite, unite:l.unite}));
  of.auteur = S.auth.user ? String(S.auth.user.email||'') : '';
  of.etat = 'planifie';
  return of;
}
function ofHTML(o){
  const cost = can('cout');
  const pieces = o.lignes.reduce((s,l) => s + l.pieces, 0), pate = o.lignes.reduce((s,l) => s + l.pate_g, 0);
  const kv = `<dl class="kv">
    <div><dt>${t('date_prod')}</dt><dd>${esc(dayFmt(o.jour))}</dd></div>
    <div><dt>${t('debut')}</dt><dd>${hhmm(o.debutMin)}</dd></div>
    <div><dt>${t('time_end')}</dt><dd>${hhmm(o.finEstimee)}</dd></div>
    <div><dt>${t('total_pate')}</dt><dd>${fq(pate,false)}</dd></div>
    <div><dt>${t('pieces_n')}</dt><dd>${fmt(pieces,0,0)}</dd></div>
    ${cost ? `<div><dt>${t('cost_mat')}</dt><dd>${money(o.coutTotal)}</dd></div>` : ''}</dl>`;
  const lines = o.lignes.map(l => `<article class="card ofl">
    <div class="ofh"><span class="oft">${hhmm(l.heureLancement)}</span>
      <div><strong>${esc(lname(l))}</strong><div class="muted">${fmt(l.quantite,0,2)} ${t('u_'+l.unite)} · ${fmt(l.pieces,0,0)} ${t('pcs')} · ${fq(l.pate_g,false)}${cost ? ' · ' + money(l.cout) : ''}</div></div></div>
    <details><summary>${t('detail')}</summary>
      <div class="scroll"><table><thead><tr><th>${t('ing')}</th><th>${t('qty')}</th></tr></thead><tbody>
        ${l.ingredients.map(i => `<tr><td>${esc(i.nom)}</td><td>${fq(i.qte_g, i.liq)}</td></tr>`).join('')}</tbody></table></div>
      ${l.etapes.length ? `<ol class="proc">${l.etapes.map(e => `<li><strong>${hhmm(e.debut)}</strong> · ${t('tp_'+e.type)}
        <span class="muted">${e.duree ? fmt(e.duree,0,0) + ' ' + t('min') : ''}${e.temp ? ' · ' + esc(e.temp) + ' °C' : ''}</span>${e.desc ? `<div>${esc(e.desc)}</div>` : ''}</li>`).join('')}</ol>` : ''}
    </details></article>`).join('');
  const needs = `<div class="scroll"><table><thead><tr><th>${t('ing')}</th><th>${t('qty')}</th>${cost?`<th>${t('line')}</th>`:''}</tr></thead><tbody>
    ${o.besoinsGlobaux.map(b => `<tr><td>${esc(b.nom)}</td><td><strong>${fmt(b.qte,0,1)} ${b.unite}</strong></td>${cost?`<td>${money(b.cout)}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
  return `${kv}<h2>${t('launch')}</h2>${lines}<p class="muted">${t('est_note')}</p>
    <h2>${t('needs')}</h2>${needs}
    <h2>${t('s_all')}</h2>${(o.allergenes||[]).length ? `<p>${tagsHTML(new Set(o.allergenes))}</p>` : `<p class="muted">${t('no_all')}</p>`}`;
}
function previewHTML(){
  const o = S.ofPrev; if(!S.cmd || !S.cmd.show || !o) return '';
  const warn = (o.ignores||[]).length ? `<div class="warn"><strong>${t('warn_skipped')}</strong><ul>${o.ignores.map(i =>
    `<li>${esc(i.nom || '?')} — ${t('ign_'+i.raison)}</li>`).join('')}</ul></div>` : '';
  if(!o.lignes.length) return warn || `<p class="muted">${t('of_empty')}</p>`;
  return `${warn}<h2>${t('of_title')}</h2>${ofHTML(o)}
    <div class="row noprint" style="margin-top:16px"><button class="btn" data-act="of-save">${t('save_of')}</button>
    <button class="btn ghost" data-act="print">${t('print')}</button></div>`;
}
function refreshOF(){
  if(!S.cmd || !S.cmd.show) return;
  S.ofPrev = computeOF();
  const el = $('#ofpreview'); if(el) el.innerHTML = previewHTML();
}
function histHTML(){
  if(!S.ofs.length) return `<div class="empty"><strong>${t('e_fab')}</strong><p>${t('p_fab')}</p></div>`;
  const arr = [...S.ofs].sort((a,b) => String(b.jour).localeCompare(String(a.jour)));
  return `<div class="grid">${arr.map(o => {
    const pieces = (o.lignes||[]).reduce((s,l) => s + l.pieces, 0);
    return `<button class="fcard" data-act="of-open" data-id="${esc(o.id)}"><span class="ft"><strong>${esc(dayFmt(o.jour))}</strong>
      <small>${(o.lignes||[]).length} ${t('products_n')} · ${fmt(pieces,0,0)} ${t('pcs')} · ${hhmm(o.debutMin)} → ${hhmm(o.finEstimee)}</small></span>
      ${o._pending ? `<span class="badge s-test">${t('pending_sync')}</span>` : ''}</button>`; }).join('')}</div>`;
}
function fabList(){
  return `<h1>${t('h_fab')}</h1><p class="sub">${t('s_fab')}</p>
    ${can('exec') ? `<div class="row" style="margin-bottom:6px"><button class="btn" data-act="of-new">${t('new_of')}</button></div>` : ''}
    <h2>${t('hist')}</h2>${histHTML()}`;
}
function fabEditor(){
  const c = S.cmd, fiches = producible();
  if(c.show && window.OF_ENGINE) S.ofPrev = computeOF();
  const rows = c.lignes.map((l,k) => { const f = S.fiches.find(x => x.id===l.ficheId);
    return `<div class="cmd-ligne"><span class="cmd-nom">${esc(f ? fname(f) : '?')}</span>
      <input class="cmd-q" inputmode="decimal" placeholder="${t('qty')}" aria-label="${t('qty')}" data-c="${k}" data-k="quantite" value="${esc(l.quantite)}">
      <select class="cmd-u" aria-label="${t('unit')}" data-c="${k}" data-k="unite">${['piece','kg','plaque'].map(u => opt(u, t('u_'+u), l.unite)).join('')}</select>
      <button class="x" data-act="of-del-line" data-idx="${k}" aria-label="${t('del')}">×</button></div>`; }).join('');
  return `<h1>${t('cmd_title')}</h1><p class="sub"> </p>
    <div class="row noprint" style="margin-bottom:14px"><button class="btn ghost" data-act="of-back">${t('back')}</button></div>
    <section class="card"><div class="form">
      ${fl(t('date_prod'), `<input type="date" data-cf="jour" value="${esc(c.jour)}">`)}
      ${fl(t('debut'), `<input type="time" data-cf="debut" value="${esc(c.debut)}">`)}</div>
      ${fiches.length ? `<div class="cmd-lignes">${rows}</div>
        <div class="fl"><select id="addprod" aria-label="${t('add_prod')}"><option value="">${t('add_prod')}</option>
        ${fiches.map(f => opt(f.id, fname(f) + ' (' + f.code + ')', '')).join('')}</select></div>`
        : `<p class="muted">${t('no_prod')}</p>`}
      <div class="row" style="margin-top:14px"><button class="btn" data-act="of-calc" ${c.lignes.length ? '' : 'disabled'}>${t('calc')}</button></div>
    </section>
    <div id="ofpreview">${previewHTML()}</div>`;
}
function ofPage(o){
  return `${printHead(t('of_title') + ' — ' + dayFmt(o.jour), false)}<div class="noprint row" style="margin-bottom:14px"><button class="btn ghost" data-act="of-back">${t('back')}</button>
      <span style="margin-inline-start:auto"></span>
      ${can('exec') ? `<button class="btn" data-act="of-edit" data-id="${esc(o.id)}">${t('edit_cmd')}</button>` : ''}
      <button class="btn ghost" data-act="print">${t('print')}</button>
      ${can('delete') ? `<button class="btn danger" data-act="of-del" data-id="${esc(o.id)}">${t('del')}</button>` : ''}</div>
    <h1>${t('of_title')}</h1><p class="sub">${esc(dayFmt(o.jour))}</p>${ofHTML(o)}${lotsSection(o)}`;
}
function fabView(){
  const m = S.of.mode;
  if(m==='new' && S.cmd) return fabEditor();
  if(m==='view'){ const o = S.ofs.find(x => x.id===S.of.id); if(o) return ofPage(o); }
  S.of = {mode:'list'}; return fabList();
}
async function openCalc(){
  try{ await loadEngine(); }catch(e){ toast(t('err_engine')); return; }
  S.cmd.show = true; refreshOF();
  const el = $('#ofpreview'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}
function saveOF(){
  const o = S.ofPrev; if(!o || !o.lignes.length) return;
  if(S.ofs.some(x => x.id===o.id) && !confirm(t('of_exists'))) return;
  const rec = clone(o); if(!window.BPM_CLOUD) rec._pending = true;
  const old = S.ofs.find(x => x.id===rec.id); if(old && old.progres) rec.progres = clone(old.progres);
  if(old && old.lots) rec.lots = clone(old.lots);
  S.ofs = S.ofs.filter(x => x.id!==rec.id); S.ofs.push(rec); persistOFs();
  if(window.BPM_CLOUD){ const c = clone(rec); delete c._pending; cloudSaveOF(c); }
  S.dirty = false; S.cmd = null; S.ofPrev = null; S.of = {mode:'view', id:rec.id}; render(); window.scrollTo(0,0); toast(t('of_saved'));
}
function fabClick(b){
  const k = +b.dataset.idx, id = b.dataset.id;
  switch(b.dataset.act){
    case 'of-new': S.cmd = {jour:todayISO(), debut:'06:00', lignes:[], show:false}; S.ofPrev = null; S.dirty = false; S.of = {mode:'new'}; render(); window.scrollTo(0,0); break;
    case 'of-open': S.of = {mode:'view', id}; render(); window.scrollTo(0,0); break;
    case 'of-back': if(!guard()) break; S.dirty = false; S.cmd = null; S.ofPrev = null; S.of = {mode:'list'}; render(); window.scrollTo(0,0); break;
    case 'of-del-line': S.cmd.lignes.splice(k,1); S.dirty = S.cmd.lignes.length > 0; render(); break;
    case 'of-calc': openCalc(); break;
    case 'of-save': saveOF(); break;
    case 'of-edit': { const o = S.ofs.find(x => x.id===id); if(!o) break;
      S.cmd = {jour:o.jour, debut:hhmm(o.debutMin), lignes:clone(o.commandes||[]), show:false}; S.ofPrev = null; S.dirty = false; S.of = {mode:'new'}; render(); openCalc(); break; }
    case 'of-del': if(!confirm(t('confirm_del_of'))) break;
      S.ofs = S.ofs.filter(x => x.id!==id); persistOFs(); cloudDelOF(id); S.of = {mode:'list'}; render(); toast(t('of_deleted')); break;
  }
}
function fabField(el){
  if(el.id==='addprod'){
    if(el.value){ const f = S.fiches.find(x => x.id===el.value);
      S.cmd.lignes.push({ficheId:el.value, quantite:'', unite: f && num(f.pieceCrue) > 0 ? 'piece' : 'kg'}); S.dirty = true; render();
      const q = document.querySelectorAll('.cmd-q'); if(q.length) q[q.length-1].focus(); }
    return true;
  }
  if(el.dataset.c !== undefined && S.cmd){ S.cmd.lignes[+el.dataset.c][el.dataset.k] = el.value; S.dirty = true; refreshOF(); return true; }
  if(el.dataset.cf && S.cmd){ S.cmd[el.dataset.cf] = el.value; S.dirty = true; refreshOF(); return true; }
  return false;
}
window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach(d => d.open = true));

/* ---- Mode terrain : exécution des OF (étapes, minuteurs, alarmes) ---- */
const ofById = id => S.ofs.find(x => x.id===id);
const stepKey = (fid, i) => fid + '_' + i;
const isDone = (o, fid, i) => !!(o.progres && o.progres[stepKey(fid, i)]);
const lineProg = (o, l) => ({ n:l.etapes.length, d:l.etapes.filter((e,i) => isDone(o, l.ficheId, i)).length });
const ofProg = o => o.lignes.reduce((a,l) => { const p = lineProg(o,l); return {n:a.n+p.n, d:a.d+p.d}; }, {n:0, d:0});
const tKey = (oid, fid, i) => oid + '|' + fid + '|' + i;
const persistTimers = () => { try{ localStorage.setItem('bpm.timers', JSON.stringify(S.timers)); }catch(e){} };
const mmss = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : String(m).padStart(2,'0')) + ':' + String(x).padStart(2,'0'); };
const remaining = tm => tm.end ? Math.ceil((tm.end - Date.now())/1000) : (tm.left != null ? tm.left : tm.dur);
const bar = (d, n) => `<div class="terrain-progress"><div class="bar"><i style="width:${n ? Math.round(d/n*100) : 0}%"></i></div><small>${d}/${n}</small></div>`;

/* Son, vibration, écran allumé, plein écran */
let audioCtx = null, alarmQ = [], alarmIv = null, wl = null;
function ensureAudio(){ try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }catch(e){} }
function beep(){
  try{ if(audioCtx){ const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'square'; o.frequency.value = 880; g.gain.value = .15;
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + .25); } }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch(e){}
}
function showAlarm(){
  const el = $('#alarm');
  if(!alarmQ.length){ el.hidden = true; clearInterval(alarmIv); alarmIv = null; return; }
  el.hidden = false;
  el.innerHTML = `<div class="alarm-card"><div class="alarm-ic" aria-hidden="true">⏰</div><h2>${t('time_up')}</h2><p>${esc(alarmQ[0])}</p>
    <button class="timer-btn" data-alarm="ok" type="button">OK</button></div>`;
  if(!alarmIv){ beep(); alarmIv = setInterval(beep, 1400); }
}
$('#alarm').addEventListener('click', e => { if(e.target.closest('[data-alarm]')){ alarmQ.shift(); showAlarm(); } });
async function keepAwake(on){
  try{
    if(on && !wl && 'wakeLock' in navigator){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); }
    else if(!on && wl){ await wl.release(); wl = null; }
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && S.view==='terrain' && S.tr.mode==='run') keepAwake(true); });
document.addEventListener('fullscreenchange', () => { if(!document.fullscreenElement && S.fs){ S.fs = false; render(); } });
function toggleFS(){
  S.fs = !S.fs;
  try{ if(S.fs && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
       else if(!S.fs && document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  render();
}

/* Minuteurs (horodatage de fin : restent exacts même si l'écran se verrouille) */
function tickAll(){
  const now = Date.now(); let fired = false;
  Object.keys(S.timers).forEach(k => { const tm = S.timers[k];
    if(tm.end && tm.end - now <= 0){ tm.end = null; tm.left = 0; tm.fired = true; fired = true; alarmQ.push(tm.label || ''); } });
  if(fired){ persistTimers(); showAlarm(); }
  document.querySelectorAll('[data-tkey]').forEach(el => { const tm = S.timers[el.dataset.tkey]; if(tm) el.textContent = mmss(remaining(tm)); });
  if(fired && S.view==='terrain') render();
}
setInterval(tickAll, 500);
Object.keys(S.timers).forEach(k => { if(Date.now() - (S.timers[k].t0 || 0) > 36*3600*1000) delete S.timers[k]; });

function timerAct(act, o, l, i){
  const key = tKey(o.id, l.ficheId, i), e = l.etapes[i], dur = Math.round(num(e.duree)*60);
  let tm = S.timers[key];
  if(act==='tr-t-start'){
    ensureAudio();
    if(!tm || tm.fired){ tm = S.timers[key] = {dur, left:dur, end:null, fired:false, t0:Date.now()}; }
    tm.label = t('tp_'+e.type) + ' — ' + lname(l);
    tm.end = Date.now() + (tm.left != null ? tm.left : dur)*1000;
  } else if(act==='tr-t-pause' && tm && tm.end){
    tm.left = Math.max(0, Math.ceil((tm.end - Date.now())/1000)); tm.end = null;
  } else if(act==='tr-t-reset'){ delete S.timers[key]; }
  persistTimers(); render();
}
function toggleStep(o, l, i){
  if(!can('exec')) return;
  const key = stepKey(l.ficheId, i); o.progres = o.progres || {};
  const val = o.progres[key] ? null : Date.now();
  if(val) o.progres[key] = val; else delete o.progres[key];
  if(val){ delete S.timers[tKey(o.id, l.ficheId, i)]; persistTimers(); }
  persistOFs();
  if(window.BPM_CLOUD && !o._pending) window.BPM_CLOUD.progress(o.id, key, val);
  render();
}

/* Écrans */
function stripHTML(){
  const act = Object.keys(S.timers).filter(k => S.timers[k].end || S.timers[k].fired);
  if(!act.length) return '';
  return `<div class="tstrip"><strong>${t('running_timers')}</strong>${act.map(k => { const tm = S.timers[k];
    return `<span class="tchip ${tm.fired ? 'expired' : ''}"><span>${esc(tm.label||'')}</span><b data-tkey="${esc(k)}">${mmss(remaining(tm))}</b></span>`; }).join('')}</div>`;
}
function trList(){
  const arr = [...S.ofs].sort((a,b) => String(b.jour).localeCompare(String(a.jour)));
  const body = arr.length ? `<div class="terrain-list">${arr.map(o => {
    const p = ofProg(o), pct = p.n ? Math.round(p.d/p.n*100) : 0, fini = p.n > 0 && p.d===p.n;
    return `<button class="terrain-card ${fini ? 'done' : ''}" data-act="tr-open-of" data-id="${esc(o.id)}">
      <span class="big-icon" style="font-size:1.3rem">${fini ? '✓' : pct + '%'}</span>
      <span><h3>${esc(dayFmt(o.jour))}${o.jour===todayISO() ? ' · ' + t('today') : ''}</h3>
        <span class="meta">${o.lignes.length} ${t('products_n')} · ${hhmm(o.debutMin)} → ${hhmm(o.finEstimee)}</span></span>
      <span class="prog">${p.d}/${p.n}<br>${t('steps_n')}</span></button>`; }).join('')}</div>`
    : `<div class="empty"><strong>${t('e_terrain')}</strong><p>${t('p_terrain')}</p>
        <button class="btn" data-v="fab" type="button">${t('go_fab')}</button></div>`;
  return `<h1>${t('h_terrain')}</h1><p class="sub">${t('s_terrain')}</p>${stripHTML()}${body}`;
}
function trOF(o){
  const p = ofProg(o);
  return `<div class="terrain-run"><div class="terrain-top"><h2>${esc(dayFmt(o.jour))}</h2>
      <div class="actions"><button class="timer-btn ghost" data-act="tr-back">${t('back')}</button></div></div>
    ${bar(p.d, p.n)}${stripHTML()}
    ${!can('exec') ? `<p class="muted">${t('readonly_note')}</p>` : ''}
    <div class="terrain-list">${o.lignes.map(l => { const lp = lineProg(o,l), fini = lp.n > 0 && lp.d===lp.n;
      return `<button class="terrain-card ${fini ? 'done' : ''}" data-act="tr-open-line" data-id="${esc(l.ficheId)}">
        <span class="big-icon" style="font-size:1.15rem">${fini ? '✓' : hhmm(l.heureLancement)}</span>
        <span><h3>${esc(lname(l))}</h3><span class="meta">${fmt(l.quantite,0,2)} ${t('u_'+l.unite)} · ${fmt(l.pieces,0,0)} ${t('pcs')}</span></span>
        <span class="prog">${lp.d}/${lp.n}<br>${t('steps_n')}</span></button>`; }).join('')}</div></div>`;
}
function trRun(o, l){
  const lp = lineProg(o,l), ex = can('exec');
  const steps = l.etapes.map((e,i) => {
    const done = isDone(o, l.ficheId, i), key = tKey(o.id, l.ficheId, i), tm = S.timers[key], dur = Math.round(num(e.duree)*60);
    const running = !!(tm && tm.end), expired = !!(tm && tm.fired);
    const tcls = done ? 'done' : expired ? 'expired' : running ? 'running' : '';

/* Enregistrement local + cloud (marqué « à synchroniser » si le cloud n'est pas joignable) */
function putItem(kind, rec, atStart){
  const arr = S[kind], i = arr.findIndex(x => x.id===rec.id);
  const local = clone(rec); if(!window.BPM_CLOUD) local._pending = true;
  if(i >= 0) arr[i] = local; else if(atStart) arr.unshift(local); else arr.push(local);
  persistKey(kind); cloudQ('saveItem', COLL[kind], clone(rec));
}
function dropItem(kind, id){ S[kind] = S[kind].filter(x => x.id!==id); persistKey(kind); cloudQ('removeItem', COLL[kind], id); }

const weekStart = iso => { const p = iso.split('-').map(Number), d = new Date(p[0], p[1]-1, p[2]); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return isoOf(d); };
function taskState(task, day){
  const docs = task.freq==='semaine' ? S.nett.filter(n => n.date >= weekStart(day) && n.date <= addDays(weekStart(day), 6)) : S.nett.filter(n => n.date===day);
  for(const n of docs){ const d = n.done && n.done[task.id]; if(d) return {date:n.date, ts:d.ts, par:d.par, here:n.date===day}; }
  return null;
}

function tickTask(id){
  if(!can('exec')) return;
  const day = S.ql.date || todayISO(), task = S.taches.find(k => k.id===id); if(!task) return;
  const s = taskState(task, day); if(s && !s.here) return;
  let doc = S.nett.find(n => n.id===day);
  if(!doc){ doc = {id:day, date:day, done:{}}; S.nett.unshift(doc); }
  doc.done = doc.done || {};
  let val;
  if(doc.done[id]){ delete doc.done[id]; val = null; } else { val = {ts:nowISO(), par:whoami()}; doc.done[id] = val; }
  if(!window.BPM_CLOUD) doc._pending = true;
  persistKey('nett'); cloudQ('saveItem', COLL.nett, {id:day, date:day, done:{[id]:val}}); render();
}

  const o = ofById(id); if(!o || !can('exec')) return;
  o.lots = o.lots || {}; val = String(val).trim();
  if(val) o.lots[key] = val; else delete o.lots[key];
  persistOFs(); if(window.BPM_CLOUD && !o._pending) cloudQ('saveItem', 'ofs', {id:o.id, lots:{[key]:val || null}});
}

function qualiteView(){

/* ---------- Étiquettes allergènes ---------- */
const LBL_FMT = { A7:{w:74, h:105, fs:7.4, name:'A7 · 74 × 105 mm'}, A6:{w:105, h:148, fs:9.6, name:'A6 · 105 × 148 mm'}, L10:{w:100, h:70, fs:7.6, name:'100 × 70 mm'} };
function labelHTML(f, L){
  const al = finalAllerg(f), E = S.etiq, lang = L.lang;
  const both = (fr, ar) => lang==='fr' ? fr : lang==='ar' ? `<span dir="rtl" lang="ar">${ar}</span>` : `${fr} <span class="ar" dir="rtl" lang="ar">${ar}</span>`;
  const ings = (f.ingredients||[]).filter(i => num(i.qte) > 0 && String(i.nom).trim())
    .sort((a,b) => num(b.qte)*(TO_G[b.unite]||1) - num(a.qte)*(TO_G[a.unite]||1));
  const list = isNegoce(f) ? esc(f.composition||'') : ings.map(i => { const a = detect(i.nom); return a.size ? `<b>${esc(i.nom)}</b>` : esc(i.nom); }).join(', ');
  const alFR = [...al].map(id => T.fr['a_'+id]).join(', '), alAR = [...al].map(id => T.ar['a_'+id]).join('، ');
  const row = (fr, ar, val) => val ? `<div class="lr"><span>${both(fr, ar)}</span><b>${esc(val)}</b></div>` : '';
  return `<div class="lbl lbl-${L.fmt}"><div class="lbl-h">${E.raison ? `<img src="logo.png" alt=""><div><strong>${esc(E.raison)}</strong><br>${esc(E.adresse||'')}${E.tel ? ' · ' + esc(E.tel) : ''}</div>` : '<img src="logo.png" alt="">'}</div>
    <div class="lbl-n">${lang!=='ar' ? `<div class="n1">${esc(f.nomFr)}</div>` : ''}${lang!=='fr' && f.nomAr ? `<div class="n2" dir="rtl" lang="ar">${esc(f.nomAr)}</div>` : (lang==='ar' ? `<div class="n1">${esc(f.nomFr)}</div>` : '')}</div>
    ${list ? `<p><b>${both('Ingrédients :', 'المكونات:')}</b> ${list}.</p>` : ''}
    <p class="lbl-al"><b>${both('Contient :', 'يحتوي على:')}</b> ${al.size ? both(esc(alFR), esc(alAR)) : both('aucun allergène majeur déclaré', 'لا مسببات حساسية رئيسية معلنة')}</p>
    ${row('Poids net', 'الوزن الصافي', L.net)}${row('Fabriqué le', 'تاريخ الإنتاج', L.prod ? dShort(L.prod) : '')}
    ${row('À consommer avant le', 'يُستهلك قبل', L.dlc ? dShort(L.dlc) : '')}${row('Lot', 'رقم الدفعة', L.lot)}
    ${row('Conservation', 'الحفظ', f.stockage)}${row('Prix TTC', 'الثمن شامل الضريبة', L.prix ? L.prix + ' DH' : '')}</div>`;
}
function showLabel(id){
  const f = S.fiches.find(x => x.id===id); if(!f) return;
  const prod = todayISO();
  S.lbl = {id, net:'', prod, dlc: f.dlc && num(f.dlc) > 0 ? addDays(prod, Math.round(num(f.dlc))) : '', lot:'L' + prod.slice(2).replace(/-/g,''), prix: f.prixVente ? String(f.prixVente) : '', copies:'1', fmt:'A7', lang:'both', dlcManual:false};
  const m = $('#modal'); m.hidden = false; m.dataset.kind = 'label'; drawLabelModal();
}
function drawLabelModal(){

  const inp = (k, extra='') => `<input data-lbl="${k}" value="${esc(L[k])}" ${extra}>`;

    <div class="lbl-grid"><div class="lbl-form form">
      ${fl(t('net_weight'), inp('net', 'placeholder="350 g"'))}${fl(t('made_on'), inp('prod', 'type="date"'))}${fl(t('dlc_label'), inp('dlc', 'type="date"'))}
      ${fl(t('lot_label'), inp('lot'))}${fl(t('price'), inp('prix', 'inputmode="decimal"'))}${fl(t('copies'), inp('copies', 'inputmode="numeric"'))}
      ${fl(t('format'), `<select data-lbl="fmt">${Object.keys(LBL_FMT).map(k => opt(k, LBL_FMT[k].name, L.fmt)).join('')}</select>`)}

}
function printLabels(){
  const f = S.fiches.find(x => x.id===S.lbl.id), L = S.lbl, F = LBL_FMT[L.fmt]; if(!f) return;
  const n = Math.min(Math.max(parseInt(L.copies, 10) || 1, 1), 200);
  $('#lblprint').innerHTML = Array.from({length:n}, () => labelHTML(f, L)).join('');

window.addEventListener('afterprint', () => { document.body.classList.remove('plbl'); const st = $('#pgstyle'); if(st) st.textContent = ''; const lp = $('#lblprint'); if(lp) lp.innerHTML = ''; });
$('#modal').addEventListener('input', e => {
  const el = e.target; if(!el.dataset.lbl || !S.lbl) return;
  S.lbl[el.dataset.lbl] = el.value;
  if(el.dataset.lbl==='dlc') S.lbl.dlcManual = true;
  if(el.dataset.lbl==='prod' && !S.lbl.dlcManual){ const f = S.fiches.find(x => x.id===S.lbl.id); if(f && num(f.dlc) > 0 && el.value){ S.lbl.dlc = addDays(el.value, Math.round(num(f.dlc))); const d = $('[data-lbl="dlc"]'); if(d) d.value = S.lbl.dlc; } }

});
$('#modal').addEventListener('change', e => { if(e.target.dataset && e.target.dataset.lbl && (e.target.tagName==='SELECT')){ S.lbl[e.target.dataset.lbl] = e.target.value; const f = S.fiches.find(x => x.id===S.lbl.id); if(f) $('#lblprev').innerHTML = labelHTML(f, S.lbl); } });
$('#modal').addEventListener('click', e => { const b = e.target.closest('[data-m="lblprint"]'); if(b) printLabels(); });

/* ---------- Actions ---------- */
function qClick(b){
  const act = b.dataset.act, id = b.dataset.id;
  switch(act){
    case 'q-tab': S.ql.tab = id; render(); window.scrollTo(0,0); break;
    case 'q-sign': { const v = String(S.tmp.val||''); S.tmp.val = v.startsWith('-') ? v.slice(1) : '-' + v; const i = document.querySelector('[data-q="val"]'); if(i){ i.value = S.tmp.val; i.focus(); } updateTmpWarn(); break; }
    case 'q-temp-save': saveTemp(); break;
    case 'q-seed-eq': EQ_DEF.forEach(e => putItem('eqs', Object.assign({id:uid()}, e))); render(); break;
    case 'q-add-eq': { const n = String(S.qf.eqname||'').trim(); if(!n){ toast(t('err_nom')); break; }
      putItem('eqs', {id:uid(), nom:n, type:S.qf.eqtype||'frigo', min:String(S.qf.eqmin||'').trim(), max:String(S.qf.eqmax||'').trim()}); S.qf.eqname = S.qf.eqmin = S.qf.eqmax = ''; render(); break; }
    case 'q-del-eq': if(confirm(t('confirm_del_q'))){ dropItem('eqs', id); render(); } break;
    case 'q-del-rel': if(confirm(t('confirm_del_q'))){ dropItem('releves', id); render(); } break;
    case 'q-seed-tasks': TASKS_DEF.forEach(k => putItem('taches', Object.assign({id:uid()}, k))); render(); break;
    case 'q-add-task': { const n = String(S.qf.taskname||'').trim(); if(!n){ toast(t('err_nom')); break; }
      putItem('taches', {id:uid(), nom:n, freq:S.qf.taskfreq||'jour'}); S.qf.taskname = ''; render(); break; }
    case 'q-del-task': if(confirm(t('confirm_del_q'))){ dropItem('taches', id); render(); } break;
    case 'q-tick': tickTask(id); break;
    case 'q-lot-save': saveLot(); break;
    case 'q-del-lot': if(confirm(t('confirm_del_q'))){ dropItem('lots', id); render(); } break;
    case 'q-save-etab': { const o = {raison:S.etiq.raison||'', adresse:S.etiq.adresse||'', tel:S.etiq.tel||''};
      S.etiq = Object.assign({}, o); if(!window.BPM_CLOUD) S.etiq._pending = true; persistKey('etiq'); cloudQ('saveItem', 'config', Object.assign({id:'etiquette'}, o)); toast(t('saved')); break; }
    case 'q-open-of': S.view = 'fab'; S.of = {mode:'view', id}; location.hash = 'fab'; render(); window.scrollTo(0,0); break;
  }
}
function qField(el, e){
  if(el.dataset.etab){ S.etiq[el.dataset.etab] = el.value; return true; }
  if(el.dataset.lot !== undefined){ if(e.type==='change') saveOFLot(S.of.id, el.dataset.lot, el.value); return true; }
  const k = el.dataset.q; if(k===undefined) return false;
  if(['eq','val','note'].includes(k)){ S.tmp[k] = el.value; updateTmpWarn(); return true; }
  if(['eqname','eqtype','eqmin','eqmax','taskname','taskfreq'].includes(k)){ S.qf[k] = el.value; return true; }
  if(k==='date'){ if(e.type==='change'){ S.ql.date = el.value || null; render(); } return true; }
  if(k.startsWith('lot_')){ const m = {lot_ing:'ing', lot_no:'lot', lot_sup:'sup', lot_recu:'recu', lot_dlc:'dlc'}[k]; S.lotf[m] = el.value; return true; }
  if(k==='lotq'){ S.ql.lotq = el.value; $('#qlist').innerHTML = lotsListHTML(); return true; }
  if(k==='traceq'){ S.ql.traceq = el.value; $('#qlist').innerHTML = traceHTML(); return true; }
  return false;
}
function refreshQ(){
  const ae = document.activeElement, typing = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  if(typing) return;
  if(S.view==='qualite' || S.view==='set' || (S.view==='fiches' && S.fv.mode==='view')) render();
}

/* ---- Événements ---- */
$('#view').addEventListener('click', e => {
  const fam = e.target.closest('[data-fam]');
  if(fam){ S.ffam = fam.dataset.fam; S.q = ''; S.fst = ''; go('fiches'); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  if(b.dataset.act.startsWith('of-')){ fabClick(b); return; }
  if(b.dataset.act.startsWith('tr-')){ terrainClick(b); return; }
  if(b.dataset.act.startsWith('q-')){ qClick(b); return; }
  const id = b.dataset.id, k = +b.dataset.idx, d = S.draft;
  switch(b.dataset.act){
    case 'open': S.fv = {mode:'view', id}; render(); window.scrollTo(0,0); break;
    case 'new': startEdit(null); break;
    case 'edit': startEdit(S.fiches.find(x => x.id===id)); break;
    case 'dup': duplicate(id); break;
    case 'del': remove(id); break;
    case 'print': toast(t('pdf_hint')); setTimeout(() => window.print(), 250); break;
    case 'pdf': printFiche(S.fv.id); break;
    case 'qr': showQR(S.fv.id); break;
    case 'lbl': showLabel(S.fv.id); break;
    case 'src-del': { const s = d.sources[k]; if(s && s.path) (d._rm = d._rm || []).push(s.path); d.sources.splice(k,1); S.dirty = true; render(); break; }
    case 'media-del': { const e2 = d.etapes[k]; if(e2 && e2.media && e2.media.path) (d._rm = d._rm || []).push(e2.media.path); if(e2) delete e2.media; S.dirty = true; render(); break; }
    case 'seed': seedExamples(); render(); break;
    case 'back': if(!guard()) return; leaveEditor(); S.fv = {mode:'list'}; render(); window.scrollTo(0,0); break;
    case 'save': saveDraft(); break;
    case 'add-ing': d.ingredients.push({nom:'',qte:'',unite:'g',prix:''}); S.dirty = true; render(); focusLast('.ing .n'); break;
    case 'del-ing': d.ingredients.splice(k,1); if(!d.ingredients.length) d.ingredients.push({nom:'',qte:'',unite:'g',prix:''}); S.dirty = true; render(); break;
    case 'add-step': d.etapes.push({type:'petrissage',desc:'',duree:'',temp:''}); S.dirty = true; render(); focusLast('.stp .d'); break;
    case 'del-step': d.etapes.splice(k,1); S.dirty = true; render(); break;
    case 'up-step': if(k>0){ [d.etapes[k-1], d.etapes[k]] = [d.etapes[k], d.etapes[k-1]]; S.dirty = true; render(); } break;
    case 'down-step': if(k<d.etapes.length-1){ [d.etapes[k+1], d.etapes[k]] = [d.etapes[k], d.etapes[k+1]]; S.dirty = true; render(); } break;
    case 'allerg': toggleAllerg(id); break;
    case 'photo-del': d.photo = ''; S.dirty = true; render(); break;
  }
});
function onField(e){
  const el = e.target, d = S.draft;
  if(el.id==='q'){ S.q = el.value; $('#list').innerHTML = listHTML(); return; }
  if(el.id==='ffam'){ S.ffam = el.value; $('#list').innerHTML = listHTML(); return; }
  if(el.id==='fst'){ S.fst = el.value; $('#list').innerHTML = listHTML(); return; }
  if(el.dataset.media !== undefined){ handleStepMedia(+el.dataset.media, el.files && el.files[0]); el.value = ''; return; }
  if(el.id==='srcfile'){ handleSource(el.files && el.files[0]); el.value = ''; return; }
  if(qField(el, e)) return;
  if(S.view==='fab' && fabField(el)) return;
  if(el.id==='photo'){ if(el.files[0]) readPhoto(el.files[0]); return; }
  if(!d) return;
  if(el.dataset.i !== undefined){ d.ingredients[+el.dataset.i][el.dataset.k] = el.value; }
  else if(el.dataset.s !== undefined){ d.etapes[+el.dataset.s][el.dataset.k] = el.value; }
  else if(el.dataset.f){
    d[el.dataset.f] = el.value;
    if(el.dataset.f==='famille'){ S.dirty = true; render(); return; }
  } else return;
  S.dirty = true; refreshCalc();
}
$('#view').addEventListener('input', onField);
$('#view').addEventListener('change', e => { const t2 = e.target; if(t2.tagName==='SELECT' || t2.type==='file' || t2.dataset.lot !== undefined || t2.dataset.q==='date') onField(e); });
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if(b) go(b.dataset.v); });
$('#langBtn').addEventListener('click', () => setLang(S.lang==='fr' ? 'ar' : 'fr'));
$('#role').addEventListener('change', e => { S.role = e.target.value; store.set('role', S.role); render(); });
window.addEventListener('online', netStatus); window.addEventListener('offline', netStatus);
window.addEventListener('beforeunload', e => { if(S.dirty){ e.preventDefault(); e.returnValue = ''; } });
function applyPending(){
  if(S.pendingFiche && S.fiches.some(f => f.id===S.pendingFiche)){
    S.view = 'fiches'; S.fv = {mode:'view', id:S.pendingFiche}; S.pendingFiche = null;
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    return true;
  }
  return false;
}
function route(){
  const m = /^fiche=(.+)$/.exec(location.hash.slice(1));
  if(m){ S.pendingFiche = decodeURIComponent(m[1]); if(applyPending()) render(); }
}
window.addEventListener('hashchange', route);
const h0 = location.hash.slice(1); if(NAV.includes(h0)) S.view = h0;
route();
render();
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }

</script>

<script type="module">
/* Pont Firebase : chargé en dynamique pour que l'application reste utilisable hors ligne */
(async () => {
  const B = window.BPM;
  let cloud;
  try{
    cloud = await Promise.race([
      import('./firebase-sync.js'),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 8000))
    ]);
  }catch(err){ console.warn('[Cloud] indisponible :', err); B.cloudUnavailable(); return; }

  const ROLE_OK = ['chef', 'equipe', 'moniteur'];
  let netTimer = null;
  let unsubV = [];
  let unsubP = null, unsubF = null, unsubO = null, startedFor = null, migrating = false;

  window.BPM_CLOUD = {
    save:   f  => cloud.saveFiche(f).catch(e => B.cloudError(e)),
    del:    id => cloud.deleteFiche(id).catch(e => B.cloudError(e)),
    saveOF: o  => cloud.saveOF(o).catch(e => B.cloudError(e)),
    saveItem:   (c, o) => cloud.saveItem(c, o).catch(e => B.cloudError(e)),
    removeItem: (c, id) => cloud.removeItem(c, id).catch(e => B.cloudError(e)),
    delOF:  id => cloud.deleteOF(id).catch(e => B.cloudError(e)),
    upload: (path, file, cb) => cloud.uploadFile(path, file, cb),
    removeFile: p => cloud.deleteStorageFile(p).catch(() => {}),
    progress: (id, key, val) => cloud.setOFProgress(id, key, val).catch(e => { if(!e || e.code !== 'not-found') B.cloudError(e); }),
    login:  (email, pwd) => cloud.loginEmail(email, pwd),
    signup: (email, pwd) => cloud.signupEmail(email, pwd),
    google: () => cloud.loginGoogle(),
    logout: () => cloud.logout()
  };

  /** Pourquoi le compte reste « en attente » : message précis affiché à l'écran. */
  function diagnose(user, prof, info){
    if(info && info.error) return info.error === 'permission-denied' ? {k:'diag_rules'} : {k:'diag_net', extra:info.error};
    if(prof) return {k:'diag_role', extra: prof.role === undefined ? '(champ role absent)' : JSON.stringify(prof.role)};
    if(info && info.fromCache) return {k:'diag_wait'};
    return {k:'diag_none', extra:'companies/' + cloud.COMPANY_ID + '/users/' + user.uid};
  }

  function stopV2(){ unsubV.forEach(u => u()); unsubV = []; }
  function startV2(){
    if(unsubV.length) return;
    unsubV = [
      cloud.watchRecent('equipements', 'nom', 100, a => B.setData('eqs', a)),
      cloud.watchRecent('taches', 'nom', 200, a => B.setData('taches', a)),
      cloud.watchRecent('releves', 'ts', 500, a => B.setData('releves', a)),
      cloud.watchRecent('nettoyages', 'date', 90, a => B.setData('nett', a)),
      cloud.watchRecent('lots', 'ts', 500, a => B.setData('lots', a)),
      cloud.watchDocIn('config', 'etiquette', d => B.setEtiq(d))
    ];
  }

  function stop(){ stopV2(); if(unsubP){ unsubP(); unsubP = null; } if(unsubF){ unsubF(); unsubF = null; } if(unsubO){ unsubO(); unsubO = null; } startedFor = null; }

  function startFiches(role){
    if(unsubF) return;
    unsubF = cloud.watchFiches(async arr => {
      // Première connexion de cet appareil : envoyer les fiches locales (Chef) ou les mettre de côté (autres rôles)
      if(!cloud.hasMigrated()){
        if(migrating) return;
        const local = B.getLocalFiches();
        if(local.length){
          if(role === 'chef'){
            migrating = true;
            try{
              const ok = await cloud.migrateLocalToCloud(local);
              if(ok === local.length) cloud.markMigrated();
            } finally { migrating = false; }
            return;               // le prochain instantané contiendra les fiches envoyées
          }
          B.backupLocal();
        }
        cloud.markMigrated();
      }
      B.setFiches(arr);
    });
  }

  cloud.watchAuth(user => {
    stop();
    if(!user){ B.authState('login'); return; }
    startedFor = user.uid;
    clearTimeout(netTimer);
    unsubP = cloud.watchProfile(user.uid, (prof, info) => {
      if(!prof || !ROLE_OK.includes(prof.role)){
        if(unsubF){ unsubF(); unsubF = null; }
        if(unsubO){ unsubO(); unsubO = null; }
        stopV2();
        const d = diagnose(user, prof, info);
        B.authState('pending', user, d);
        // Toujours en cache après 6 s : le serveur n'est pas joignable
        clearTimeout(netTimer);
        if(d.k === 'diag_wait') netTimer = setTimeout(() => B.authState('pending', user, {k:'diag_net'}), 6000);
        return;
      }
      clearTimeout(netTimer);
      B.setRole(prof.role);
      B.authState('ready', user);
      startFiches(prof.role);
      if(!unsubO) unsubO = cloud.watchOFs(arr => B.setOFs(arr));
      startV2();
    });
  });
})();
</script>
